# Render Blueprint — best-effort starting point, not verified against a
# live Render account. If "New > Blueprint" in the Render dashboard flags
# a field, check it against Render's current blueprint reference; the
# manual per-service setup in DEPLOYMENT.md is the reliable fallback.
#
# Provisions: the API as a Docker web service, a managed Postgres, and a
# managed Redis. DATABASE_URL/REDIS_URL are auto-wired from the managed
# services; OPENAI_API_KEY is a secret you fill in after the blueprint
# runs (sync: false means Render prompts for it, never stores it in git).
#
# What this does NOT do: seed the database or create the read-only
# nlsql_app role docker/init.sql defines — Render's managed Postgres is a
# bare instance, it doesn't auto-run init scripts the way the official
# postgres Docker image does. That's a one-time manual step after first
# deploy — see DEPLOYMENT.md.

databases:
  - name: schemasense-db
    plan: free
    databaseName: nlsql
    user: nlsql

services:
  - type: redis
    name: schemasense-redis
    plan: free
    ipAllowList: []

  - type: web
    name: schemasense-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schemasense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: schemasense-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-pearl-nine-hu5nqtwm3d.vercel.app
      - key: SCHEMA_CACHE_TTL_SECONDS
        value: "3600"
      - key: MAX_CORRECTION_ATTEMPTS
        value: "3"
      - key: MAX_RESULT_ROWS
        value: "200"
      - key: DEMO_SESSION_TTL_SECONDS
        value: "1800"
      - key: MAX_DEMO_SESSIONS
        value: "20"
      - key: ALLOW_PRIVATE_DEMO_HOSTS
        value: "false"
      - key: RATE_LIMIT_QUERY_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_DEMO_CONNECT_PER_MINUTE
        value: "5"
      - key: RATE_LIMIT_SCHEMA_PER_MINUTE
        value: "30"
